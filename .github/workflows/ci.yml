name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-format:
    name: Rust format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  rust-clippy:
    name: Rust Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('Cargo.lock') }}

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  rust-test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('Cargo.lock') }}

      - name: Run tests
        run: cargo test --locked --workspace --all-features

      - name: Validate reference samples
        run: |
          cargo run --locked -p tmd-cli -- validate tmd-sample/sample.tmd
          cargo run --locked -p tmd-cli -- validate tmd-sample/sample.tmdp

  rust-docs:
    name: Rust documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('Cargo.lock') }}

      - name: Build documentation
        run: cargo doc --locked --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  vscode-extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tmd-vscode
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tmd-vscode/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Test
        run: npm test

      - name: Package VSIX
        run: npm run pack

  vscode-platform-packages:
    name: VSIX (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
            binary: tmd
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            binary: tmd
          - runner: macos-13
            target: darwin-x64
            binary: tmd
          - runner: macos-15
            target: darwin-arm64
            binary: tmd
          - runner: windows-2025
            target: win32-x64
            binary: tmd.exe
          - runner: windows-11-arm
            target: win32-arm64
            binary: tmd.exe
    defaults:
      run:
        working-directory: tmd-vscode
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tmd-vscode/package-lock.json

      - name: Build TMD CLI
        run: cargo build --locked --release -p tmd-cli --manifest-path ../Cargo.toml

      - name: Install extension dependencies
        run: npm ci

      - name: Stage native CLI
        run: npm run stage-cli -- ../target/release/${{ matrix.binary }} ${{ matrix.target }}

      - name: Package platform VSIX
        run: npm run pack:platform -- --target ${{ matrix.target }} --out dist/tanu-markdown-editor-${{ matrix.target }}.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: tanu-markdown-editor-${{ matrix.target }}
          path: tmd-vscode/dist/tanu-markdown-editor-${{ matrix.target }}.vsix
          if-no-files-found: error
