version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    target-branch: develop
    open-pull-requests-limit: 5
    groups:
      cargo-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /tmd-vscode
    # svelte-check 4 supports TypeScript 5 and 6. Revisit when its peer range expands.
    ignore:
      # Keep the API types compatible with engines.vscode.
      - dependency-name: "@types/vscode"
        versions: [">=1.91.0"]
      - dependency-name: typescript
        versions: [">=7"]
    schedule:
      interval: monthly
    target-branch: develop
    open-pull-requests-limit: 5
    groups:
      vscode-extension-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: develop
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    target-branch: develop

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: monthly
    target-branch: develop
