[package]
name = "tmd-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = ["crates-io"]
description = "Command-line interface for creating, validating, and converting Tanu Markdown documents"
readme = "README.md"
keywords = ["markdown", "cli", "document", "sqlite"]
categories = ["command-line-utilities"]
include = ["src/**", "Cargo.toml", "README.md", "LICENCE"]

[[bin]]
name = "tmd"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
html-escape.workspace = true
hex.workspace = true
mime_guess.workspace = true
percent-encoding.workspace = true
pulldown-cmark.workspace = true
rusqlite.workspace = true
same-file.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tmd-core = { version = "0.1.0", path = "../tmd-core" }
