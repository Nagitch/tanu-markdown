services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/workspace/tanu-markdown:cached
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
    working_dir: /workspace/tanu-markdown
    user: "vscode"
    tty: true
    init: true
    command: ["sleep", "infinity"]

volumes:
  cargo-registry:
  cargo-git:
