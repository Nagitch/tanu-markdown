[workspace]
members = [
    "tmd-core",
    "tmd-cli",
    "tmd-core-ffi",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.96"
authors = ["Tanu Markdown contributors"]
license = "MIT"
repository = "https://github.com/Nagitch/tanu-markdown"
homepage = "https://github.com/Nagitch/tanu-markdown"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
base64 = "0.23.0"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.4", features = ["derive"] }
hex = "0.4.3"
html-escape = "0.2.14"
mime = "0.3.17"
mime_guess = "2.0.5"
percent-encoding = "2.3.2"
pulldown-cmark = "0.13.4"
rusqlite = { version = "0.40.1", features = ["bundled"] }
same-file = "1.0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.19"
uuid = { version = "1.24.0", features = ["serde", "v4"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }
xattr = "1.6.1"
zip = { version = "8.6.0", default-features = false, features = ["aes-crypto", "deflate", "time"] }
